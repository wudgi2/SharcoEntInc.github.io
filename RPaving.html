<!DOCTYPE HTML>
<html>

<head>
    <title>Residential Project Images</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel=" stylesheet" href="assets/css/slider.css" />
    <noscript>
        <link rel="stylesheet" href="assets/css/noscript.css" />
    </noscript>
    <link rel="stylesheet" href="https://unpkg.com/swiper@7/swiper-bundle.min.css" />
</head>

<body>
    <div class="container">
        <div class="swiper">
            <div class="swiper-wrapper">
                <div class="swiper-slide"><img src="images/59unCh47-411733369.jpeg"></div>
                <div class="swiper-slide"><img src="images/MBV7ZlHN-411737578.jpeg"></div>
                <div class="swiper-slide"><img src="images/RDrive.jpeg"
                        style="width: 100%; max-width: 1250px; max-height: 820px; object-fit: contain;"></div>
                <div class="swiper-slide"><img src="images/RDrive2.jpeg"
                        style="width: 100%; max-width: 1250px; max-height: 820px; object-fit: contain;"></div>
                <div class="swiper-slide"><img src="images/RDrive3.jpeg"
                        style="width: 100%; max-width: 1250px; max-height: 820px; object-fit: contain;"></div>
                <div class="swiper-slide">
                    <video controls muted playsinline preload="metadata">
                        <source src="images/RDriveVideo.mp4" type="video/mp4">
                    </video>
                </div>
                <!--<div class="swiper-slide"><img src="images/.jpeg"></div>
                <div class="swiper-slide"><img src="images/.jpeg"></div>
                <div class="swiper-slide"><img src="images/.jpg"></div>
                <div class="swiper-slide"><img src="images/.jpeg"></div>
                <div class="swiper-slide"><img src="images/.jpeg"></div>
                <div class="swiper-slide"><img src="images/.jpeg"></div>
                <div class="swiper-slide"><img src="images/.jpeg"></div>
                <div class="swiper-slide"><img src="images/.jpeg"></div>
                <div class="swiper-slide"><img src="images/.jpeg"></div>
                <div class="swiper-slide"><img src="images/.jpg"></div>
                <div class="swiper-slide"><img src="images/.jpg"></div>
                <div class="swiper-slide"><img src="images/.jpg"></div>
                <div class="swiper-slide"><img src="images/.jpg"></div>
                <div class="swiper-slide"><img src="images/.jpg"></div>-->
            </div>
            <div class="swiper-pagination"></div>
            <div class="swiper-button-prev"></div>
            <div class="swiper-button-next"></div>
        </div>
    </div>

    <script src="https://unpkg.com/swiper@7/swiper-bundle.min.js"></script>

    <script>
        const swiper = new Swiper('.swiper', {
            autoplay: {
                delay: 5000,
                disableOnInteraction: false,
            },
            loop: true,

            pagination: {
                el: '.swiper-pagination',
                clickable: true,
            },

            navigation: {
                nextEl: '.swiper-button-next',
                prevEl: '.swiper-button-prev',
            },
        });

        const slideVideos = document.querySelectorAll('.swiper-slide video');

        slideVideos.forEach((video) => {
            video.addEventListener('play', () => swiper.autoplay.stop());
            video.addEventListener('pause', () => swiper.autoplay.start());
            video.addEventListener('ended', () => swiper.autoplay.start());
        });
    </script>
</body>

</html>
